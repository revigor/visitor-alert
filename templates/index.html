<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Form</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>Welcome! Please fill out the visitor form.</h1>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <ul>
                    {% for category, message in messages %}
                        <li class="flash-messages {{ category }}">{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        <form method="POST" enctype="multipart/form-data">

            <label for="visitor_name">Visitor Name:</label>
            <input type="text" id="visitor_name" name="visitor_name" required>

            <label for="company_name">Company Name:</label>
            <input type="text" id="company_name" name="company_name" required>

            <label for="purpose">Purpose of Visit:</label>
            <input type="text" id="purpose" name="purpose" required>

            <label for="department">Select Department:</label>
            <select id="department" name="department">
                <option value="1">HR</option>
                <option value="2">IT</option>
                <option value="3">Sales</option>
                <option value="4">Other</option>
            </select>

            <label for="photo">Capture Photo:</label>
            <input type="file" id="photo" name="photo" accept="image/*" capture="camera" required>
            <img id="photo-preview" style="display: none; width: 100%; margin-top: 10px;" alt="Photo Preview">

            <script>
                const photoInput = document.getElementById("photo");
                const photoPreview = document.getElementById("photo-preview");
            
                photoInput.addEventListener("change", () => {
                    const file = photoInput.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            photoPreview.src = e.target.result;
                            photoPreview.style.display = "block";
                        };
                        reader.readAsDataURL(file);
                    }
                });
            </script>

            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
