<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Form</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<!--Nav removed, adjust CSS-->

<body>    
    <div class="container">

        <header>
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Company Logo" class="company-logo">
        </header>
        
        <h1>Welcome! Please fill out the visitor form.</h1>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <ul>
                    {% for category, message in messages %}
                        <li class="flash-messages {{ category }}">{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}

        <form id="visitor-form" method="POST" enctype="multipart/form-data">

            <label for="visitor_name">Visitor Name:</label>
            <input type="text" id="visitor_name" name="visitor_name" required>

            <label for="company_name">Company Name:</label>
            <input type="text" id="company_name" name="company_name" required>

            <label for="purpose">Purpose of Visit:</label>
            <input type="text" id="purpose" name="purpose" required>

            <label for="department">Select Department:</label>
            <select id="department" name="department" required>
                <option value="" disabled selected>Select a department</option>
                <option value="HR">HR</option>
                <option value="IT">IT</option>
                <option value="Accounting">Accounting</option>
                <option value="Settlements">Settlements</option>
                <option value="Fuel">Fuel</option>
                <option value="Safety">Safety</option>
                <option value="Shop">Shop</option>
                <option value="Operations">Operations</option>
                <option value="Process">Process</option>
            </select>
            
            <label for="personnel">Select Point of Contact:</label>
            <select id="personnel" name="personnel" required>
                <option value="" disabled selected>Select a person</option>
            </select>

            <label for="photo">Capture Photo:</label>
            <input type="file" id="photo" name="photo" accept="image/*" capture="camera" required style="display: none;">
            <button type="button" id="photo-button">Open Camera</button>

            <!-- Confirmation Popup -->
            <div id="confirmation-popup" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);">
                <p>Does the photo look correct?</p>
                <img id="popup-photo-preview" style="width: 100%; margin-top: 10px;" alt="Popup Photo Preview">
                <button type="button" id="confirm-button" style="margin-top: 10px;">Yes</button>
                <button type="button" id="retake-button" style="margin-top: 10px;">Retake</button>
            </div>

            <button id="submit-button" type="submit" style="display: none;">Submit</button>
        </form>

        <script>
            const photoInput = document.getElementById("photo");
            const photoButton = document.getElementById("photo-button");
            const popup = document.getElementById("confirmation-popup");
            const popupPhotoPreview = document.getElementById("popup-photo-preview");
            const confirmButton = document.getElementById("confirm-button");
            const retakeButton = document.getElementById("retake-button");
            const submitButton = document.getElementById("submit-button");
            const form = document.getElementById("visitor-form");

            // Open camera when the "Open Camera" button is clicked
            photoButton.addEventListener("click", () => {
                photoInput.click();
            });

            // Show photo preview in the popup
            photoInput.addEventListener("change", () => {
                const file = photoInput.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        popupPhotoPreview.src = e.target.result;
                        popup.style.display = "block";
                    };
                    reader.readAsDataURL(file);
                }
            });

            // Confirm button: submit the form
            confirmButton.addEventListener("click", () => {
                popup.style.display = "none"; // Hide popup
                submitButton.click(); // Trigger form submission
            });

            // Retake button: reopen camera
            retakeButton.addEventListener("click", () => {
                popup.style.display = "none"; // Hide popup
                photoInput.value = ""; // Clear file input
                photoInput.click(); // Reopen the camera
            });

            //Dynamic Dropdown Updates
            const departmentDropdown = document.getElementById("department");
    const personnelDropdown = document.getElementById("personnel");

    // Update personnel dropdown based on selected department
    departmentDropdown.addEventListener("change", () => {
        const selectedDepartment = departmentDropdown.value;

        // Clear existing options in the personnel dropdown
        personnelDropdown.innerHTML = '<option value="" disabled selected>Select a person</option>';

        // Fetch personnel data for the selected department
        fetch(`/get_personnel?department=${encodeURIComponent(selectedDepartment)}`)
            .then(response => response.json())
            .then(data => {
                // Populate the personnel dropdown with the new options
                data.forEach(person => {
                    const option = document.createElement("option");
                    option.value = person.email; // Use email as the value
                    option.textContent = person.name; // Display the name
                    personnelDropdown.appendChild(option);
                });
            })
            .catch(error => console.error("Error fetching personnel data:", error));
    });
        </script>
    </div>
</body>
</html>
